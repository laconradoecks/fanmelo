# Waitlist API + password-protected admin page.
# Install: cp to /etc/nginx/snippets/fanmelo-waitlist.conf
# (fanmelo.conf includes it; after certbot, make sure the HTTPS server block still includes it.)

location = /api/waitlist {
    limit_except GET POST { deny all; }
    limit_req zone=fanmelo_waitlist burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
}

location /admin/ {
    auth_basic "FANMELO waitlist";
    auth_basic_user_file /etc/nginx/fanmelo-admin.htpasswd;
    add_header X-Robots-Tag "noindex" always;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
}
