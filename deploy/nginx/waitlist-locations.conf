# Waitlist API + admin dashboard (the Python service handles the admin sign-in page).
# Install: cp to /etc/nginx/snippets/fanmelo-waitlist.conf
# (fanmelo.conf includes it; after certbot, make sure the HTTPS server block still includes it.)

location = /api/waitlist {
    limit_except GET POST { deny all; }
    limit_req zone=fanmelo_waitlist burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
}

# Sign-in form: password attempts are rate limited per IP (the service also locks an IP
# out for 15 minutes after 5 wrong passwords).
location = /admin/login {
    limit_req zone=fanmelo_login burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    add_header X-Robots-Tag "noindex" always;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /admin/ {
    client_max_body_size 4k;
    add_header X-Robots-Tag "noindex" always;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /admin {
    return 301 /admin/;
}
