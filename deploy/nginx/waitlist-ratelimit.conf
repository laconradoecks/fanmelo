# http-level: at most 10 waitlist requests per minute per visitor IP
# (each page view makes one GET for the count; sign-ups are POSTs).
# Install: cp to /etc/nginx/conf.d/fanmelo-waitlist-ratelimit.conf
limit_req_zone $binary_remote_addr zone=fanmelo_waitlist:1m rate=10r/m;

# Admin sign-in: only password submissions (POST) count, at most 6 a minute per IP.
map $request_method $fanmelo_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $fanmelo_login_key zone=fanmelo_login:1m rate=6r/m;
