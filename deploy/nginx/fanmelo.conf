# Nginx server block for the FANMELO landing page.
# Lives alongside the droplet's other sites; nginx picks the block by server_name.
#
# Install (on the droplet, as root): see README.md "First-time setup".

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_HERE www.DOMAIN_HERE;

    # deploy.sh uploads the built site (dist/) here. The rest of the repo is never served.
    root /var/www/fanmelo/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML: always revalidate so updates show up straight away.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Vite gives built files content-hashed names, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # Waitlist API and admin page.
    include snippets/fanmelo-waitlist.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
